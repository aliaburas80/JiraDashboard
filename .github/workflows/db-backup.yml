# Scheduled, independent PostgreSQL backup — supplementary to Neon's own
# built-in point-in-time restore (the primary recovery mechanism; see
# product/DATABASE_BACKUP_RESTORE.md). Runs pg_dump against Neon's direct
# (unpooled) connection and uploads it straight to a private S3 prefix,
# never landing an unencrypted PII-bearing dump as a plain workflow artifact.
#
# REQUIRED SETUP BEFORE THIS CAN SUCCEED — see product/DATABASE_BACKUP_RESTORE.md §2.3:
#   Repo Settings → Secrets and variables → Actions, add:
#     NEON_DIRECT_DATABASE_URL      — Neon's UNPOOLED connection string (not the
#                                      app's own pooled DATABASE_URL)
#     DB_BACKUP_AWS_ACCESS_KEY_ID   — new IAM credential, scoped only to the
#     DB_BACKUP_AWS_SECRET_ACCESS_KEY   db-backups/ prefix (not the app's own
#                                      STORAGE_ACCESS_KEY_ID/SECRET)
#     DB_BACKUP_S3_BUCKET           — e.g. jira-data-logs
#     DB_BACKUP_S3_REGION           — e.g. us-west-2
# Until these exist, every run of this workflow will fail at the dump/upload
# step — expected, and fully decoupled from the running application.

name: Database Backup

on:
  schedule:
    # Daily, off the top of the hour to avoid GitHub Actions' scheduling congestion.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  db-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Dump, validate, and upload database backup
        env:
          # ubuntu-latest ships PostgreSQL client tools and the aws CLI. The
          # direct/unpooled URL is required because pg_dump needs a normal
          # session rather than transaction pooling.
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DB_BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DB_BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DB_BACKUP_S3_REGION }}
          S3_BUCKET: ${{ secrets.DB_BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail

          missing=0
          for name in DATABASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION S3_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured — see product/DATABASE_BACKUP_RESTORE.md §2.3."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          DUMP_FILE="/tmp/delivery-clarity-${TIMESTAMP}.dump"
          CHECKSUM_FILE="${DUMP_FILE}.sha256"
          S3_KEY="db-backups/$(basename "$DUMP_FILE")"
          S3_CHECKSUM_KEY="${S3_KEY}.sha256"

          cleanup() {
            rm -f "$DUMP_FILE" "$CHECKSUM_FILE"
          }
          trap cleanup EXIT

          # Create a custom-format dump without ownership/privilege metadata so
          # it can be restored safely into an isolated scratch target.
          pg_dump --format=custom --no-owner --no-privileges \
            --dbname="$DATABASE_URL" \
            -f "$DUMP_FILE"

          # A zero-byte/corrupt custom-format file must never be uploaded as a
          # successful backup. pg_restore --list parses the archive catalogue
          # without writing anything to a database.
          test -s "$DUMP_FILE"
          pg_restore --list "$DUMP_FILE" >/dev/null

          # Persist an integrity checksum beside the encrypted dump. The
          # checksum contains no database content or credentials.
          (
            cd /tmp
            sha256sum "$(basename "$DUMP_FILE")" > "$(basename "$CHECKSUM_FILE")"
          )

          aws s3 cp "$DUMP_FILE" "s3://${S3_BUCKET}/${S3_KEY}" --sse AES256
          aws s3 cp "$CHECKSUM_FILE" "s3://${S3_BUCKET}/${S3_CHECKSUM_KEY}" --sse AES256

          # Verify the object exists after upload and that S3 reports encryption
          # at rest. This turns an upload command returning zero into an explicit
          # end-to-end storage assertion before the workflow is marked green.
          ENCRYPTION="$(aws s3api head-object \
            --bucket "$S3_BUCKET" \
            --key "$S3_KEY" \
            --query 'ServerSideEncryption' \
            --output text)"

          if [ "$ENCRYPTION" != "AES256" ]; then
            echo "::error::Backup object exists but expected AES256 encryption; got '${ENCRYPTION}'."
            exit 1
          fi

          echo "Backup validated and stored: s3://${S3_BUCKET}/${S3_KEY}"
          echo "Checksum stored: s3://${S3_BUCKET}/${S3_CHECKSUM_KEY}"
