name: EP-004 Dependency Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/ep-004-security-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh vulnerable dependencies and lockfile
        run: |
          npm install --save nodemailer@^9.0.5 xlsx@https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz @google-cloud/storage@^8.0.1
          node scripts/security-audit.mjs
      - name: Commit dependency manifests if changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency manifests already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: remediate EP-004 dependency vulnerabilities"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
