name: Extract AI Master Plan

on:
  push:
    branches:
      - feat/intelligence-free-agents
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Word document text
        shell: python
        run: |
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          source = Path('product/Delivery_Clarity_Soft_Launch_AI_Master_Plan_v1.1.docx')
          output = Path('/tmp/ai-master-plan.txt')
          ns = {'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          with zipfile.ZipFile(source) as archive:
              xml = archive.read('word/document.xml')
          root = ET.fromstring(xml)
          lines = []
          for paragraph in root.findall('.//w:p', ns):
              text = ''.join(node.text or '' for node in paragraph.findall('.//w:t', ns)).strip()
              if text:
                  lines.append(text)
          output.write_text('\n'.join(lines), encoding='utf-8')
          print(f'Extracted {len(lines)} paragraphs to {output}')

      - name: Upload extracted plan
        uses: actions/upload-artifact@v4
        with:
          name: ai-master-plan-text
          path: /tmp/ai-master-plan.txt
          retention-days: 1
