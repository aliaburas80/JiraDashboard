name: Final admin analytics validation temporary

on:
  push:
    branches:
      - feat/admin-product-analytics

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/delivery_clarity_ci
      SESSION_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ADMIN_SESSION_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      ADMIN_MFA_ENCRYPTION_KEY: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      CONFIG_ENCRYPTION_KEY: dddddddddddddddddddddddddddddddd
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ADMIN_APP_URL: http://localhost:3001
      ALLOW_OPEN_REGISTRATION: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Repo lint
        run: npm run lint
      - name: Main typecheck
        run: npm run typecheck
      - name: Admin typecheck
        run: npm run admin:typecheck
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Main production build
        run: npm run build:app
      - name: Admin production build
        run: npm run admin:build
      - name: Remove temporary validation workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/final-admin-analytics-validation-temporary.yml
          git commit -m 'chore: remove final analytics validation workflow' || true
          git push origin HEAD:feat/admin-product-analytics
