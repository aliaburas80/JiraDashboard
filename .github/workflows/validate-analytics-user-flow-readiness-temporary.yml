name: Validate analytics user flow readiness temporary

on:
  push:
    branches: [fix/analytics-user-flow-readiness]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/delivery_clarity_ci?sslmode=disable
      SESSION_SECRET: ci-session-secret-value-at-least-32-chars
      ADMIN_SESSION_SECRET: ci-admin-session-secret-different-at-least-32-chars
      CONFIG_ENCRYPTION_KEY: ci-config-secret-value-at-least-32-chars
      APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      ADMIN_APP_URL: http://127.0.0.1:3001
      STORAGE_DRIVER: temporary
      ALLOW_TEMPORARY_STORAGE_IN_CI: 'true'
      MAX_UPLOAD_MB: '20'
      LOG_LEVEL: info
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      - run: npm run admin:typecheck
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run admin:build
