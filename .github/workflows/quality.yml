name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/delivery_clarity_ci?sslmode=disable
      SESSION_SECRET: ci-session-secret-value-at-least-32-chars
      ADMIN_SESSION_SECRET: ci-admin-session-secret-different-at-least-32-chars
      CONFIG_ENCRYPTION_KEY: ci-config-secret-value-at-least-32-chars
      STORAGE_DRIVER: temporary
      MAX_UPLOAD_MB: 20
      LOG_LEVEL: info

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck

      - name: Type check separate admin app
        run: npm run admin:typecheck

      - name: Lint styles
        run: npm run lint:css

      - name: Lint (repo-wide)
        run: npm run lint

      - name: Lint deployment changes (zero-warning gate)
        run: >
          npx eslint
          app/api/health/route.ts
          app/api/ready/route.ts
          app/api/upload/route.ts
          admin-app/app/api/auth/login/route.ts
          admin-app/lib/session.ts
          admin-app/proxy.ts
          src/lib/env/server.ts
          src/lib/logger.ts
          src/lib/prisma.ts
          src/services/storage/storageProvider.ts
          --max-warnings=0

      - name: Run tests
        run: npm run test

      - name: Build user app
        run: npm run build

      - name: Build separate admin app
        run: npm run admin:build
