name: Validate action labels temporary

on:
  push:
    branches: [fix/analytics-action-labels-admin-developer]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/delivery_clarity_ci?sslmode=disable
      SESSION_SECRET: ci-session-secret-value-at-least-32-chars
      ADMIN_SESSION_SECRET: ci-admin-session-secret-different-at-least-32-chars
      CONFIG_ENCRYPTION_KEY: ci-config-secret-value-at-least-32-chars
      APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      ADMIN_APP_URL: http://127.0.0.1:3001
      STORAGE_DRIVER: temporary
      ALLOW_TEMPORARY_STORAGE_IN_CI: 'true'
      MAX_UPLOAD_MB: '20'
      LOG_LEVEL: info
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Remove unlabeled analytics fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/ui/AnalyticsQueueInit.tsx')
          text = path.read_text()

          anchor = "function interactionSection(element: Element): string {"
          helper = r'''function humanizeControlKey(value: string): string {
            const normalized = value
              .replace(/[-_:]+/g, ' ')
              .replace(/([a-z])([A-Z])/g, '$1 $2')
              .replace(/\s+/g, ' ')
              .trim();
            return normalized.replace(/\b\w/g, char => char.toUpperCase());
          }

          function fallbackInteractionLabel(element: Element): string {
            const key = safeControlKey(element);
            const subject = key ? humanizeControlKey(key) : '';
            const role = element.getAttribute('role') ?? '';
            const expanded = element.getAttribute('aria-expanded');

            if (expanded !== null) {
              return `${expanded === 'true' ? 'Close' : 'Open'} ${subject || 'menu'}`;
            }
            if (role === 'tab') return `Select ${subject || 'tab'}`;
            if (role.startsWith('menuitem')) return `Select ${subject || 'menu item'}`;
            if (element instanceof HTMLInputElement) {
              if (element.type === 'checkbox' || element.type === 'radio') {
                return `Toggle ${subject || element.type}`;
              }
              return `Change ${subject || 'input'}`;
            }
            if (element instanceof HTMLSelectElement) return `Change ${subject || 'selection'}`;
            if (element instanceof HTMLTextAreaElement) return `Change ${subject || 'text area'}`;
            if (element.tagName.toLowerCase() === 'summary') {
              const details = element.closest('details');
              return `${details?.open ? 'Collapse' : 'Expand'} ${subject || 'section'}`;
            }
            if (element instanceof HTMLButtonElement || role === 'button') {
              return `Click ${subject || 'button'}`;
            }
            return subject ? `Use ${subject}` : `Click ${element.tagName.toLowerCase()}`;
          }

          '''

          if 'function fallbackInteractionLabel(element: Element)' not in text:
              if anchor not in text:
                  raise SystemExit('analytics helper insertion anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          text = text.replace(
              "const aria = safeAutomaticLabel(element.getAttribute('aria-label'));",
              "const aria = safeExplicitLabel(element.getAttribute('aria-label'));",
              1,
          )
          text = text.replace(
              "const title = safeAutomaticLabel(element.getAttribute('title'));",
              "const title = safeExplicitLabel(element.getAttribute('title'));",
              1,
          )

          old = "  const key = safeControlKey(element);\n  return key ? `Control ${key}` : 'Unlabeled action';"
          new = "  return fallbackInteractionLabel(element);"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('analytics fallback replacement anchor not found')

          if "'Unlabeled action'" in text:
              raise SystemExit('Unlabeled action fallback still present')

          path.write_text(text)
          PY

          if ! git diff --quiet; then
            git config user.name "Ali Abu Ras"
            git config user.email "aliaburas80@gmail.com"
            git add src/components/ui/AnalyticsQueueInit.tsx
            git commit -m "fix(analytics): eliminate unlabeled interaction events"
            git push origin HEAD:fix/analytics-action-labels-admin-developer
          fi
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      - run: npm run admin:typecheck
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run admin:build
