name: Production hardening temporary

on:
  push:
    branches:
      - chore/production-hardening-2026-08-28

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-user-session-secret-0123456789abcdef
      ADMIN_SESSION_SECRET: ci-only-admin-session-secret-fedcba9876543210
      CONFIG_ENCRYPTION_KEY: ci-only-config-encryption-key-0123456789abcdef
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/delivery_clarity_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Migrate Sass import to module system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/globals.scss')
          text = path.read_text()
          legacy = "@import '../src/styles/tokens';\n"
          modern = "@use '../src/styles/tokens';"
          if modern in text:
              raise SystemExit('Sass token module is already migrated.')
          if legacy not in text:
              raise SystemExit('Expected legacy Sass token import was not found.')
          text = text.replace(legacy, '', 1)
          text = modern + '\n\n' + text
          path.write_text(text)
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: SCSS lint
        run: npm run lint:css

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Production build
        run: npm run build

      - name: Commit validated Sass change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/production-hardening-temporary.yml
          git add app/globals.scss
          git commit -m 'chore: migrate Sass token import to module system'
          git push origin HEAD:chore/production-hardening-2026-08-28
