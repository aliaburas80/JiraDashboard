name: Fix admin analytics quality temporary

on:
  push:
    branches:
      - feat/admin-product-analytics

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Apply tenant-safe repository and CSS-variable fixes
        shell: bash
        run: |
          set -euo pipefail
          cat > src/server/tenancy/ownerProductAnalyticsRepository.ts <<'EOF'
          // Deployment-wide operational reads for the owner-only Product Analytics page.
          // Org-scoped Prisma access intentionally stays inside src/server/tenancy so
          // ordinary routes cannot accidentally copy cross-organization reads.
          import { prisma } from '@/lib/prisma';

          export async function getOwnerProductAnalyticsOperationalData(since: Date) {
            const [totalUsers, newUsers, imports] = await Promise.all([
              prisma.user.count(),
              prisma.user.findMany({
                where: { createdAt: { gte: since } },
                orderBy: { createdAt: 'desc' },
                select: {
                  id: true,
                  name: true,
                  email: true,
                  persona: true,
                  emailVerified: true,
                  createdAt: true,
                  lastLoginAt: true,
                },
              }),
              prisma.importLog.findMany({
                where: { uploadedAt: { gte: since } },
                orderBy: { uploadedAt: 'desc' },
                select: {
                  id: true,
                  userId: true,
                  status: true,
                  sourceType: true,
                  rowCount: true,
                  totalIssues: true,
                  processingTimeMs: true,
                  uploadedAt: true,
                },
              }),
            ]);

            return { totalUsers, newUsers, imports };
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          page = Path('admin-app/app/(operations)/analytics/page.tsx')
          text = page.read_text()
          text = text.replace(
              "import Link from 'next/link';\n",
              "import type { CSSProperties } from 'react';\nimport Link from 'next/link';\n",
              1,
          )
          text = text.replace(
              "import { prisma } from '../../../../src/lib/prisma';\n",
              "import { prisma } from '../../../../src/lib/prisma';\nimport { getOwnerProductAnalyticsOperationalData } from '../../../../src/server/tenancy/ownerProductAnalyticsRepository';\n",
              1,
          )

          marker = "function percent(value: number, total: number): number {\n  return total > 0 ? Math.round((value / total) * 100) : 0;\n}\n"
          helper = marker + "\nfunction analyticsWidthStyle(value: number): CSSProperties {\n  const bounded = Math.max(0, Math.min(100, value));\n  return { '--analytics-width': `${bounded}%` } as CSSProperties;\n}\n"
          if marker not in text:
              raise SystemExit('percent helper marker not found')
          text = text.replace(marker, helper, 1)

          start_marker = "  const [events, eventCount, totalUsers, newUsers, imports] = await Promise.all(["
          end_marker = "\n\n  const sampled"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          block = block.replace(start_marker, "  const [events, eventCount, operational] = await Promise.all([", 1)
          user_start = block.index("    prisma.user.count(),")
          block = block[:user_start] + "    getOwnerProductAnalyticsOperationalData(since),\n  ]);\n  const { totalUsers, newUsers, imports } = operational;"
          text = text[:start] + block + text[end:]

          replacements = {
              "style={{ width: `${Math.max(row.visitors.size ? 4 : 0, percent(row.visitors.size, maxDailyVisitors))}%` }}": "style={analyticsWidthStyle(Math.max(row.visitors.size ? 4 : 0, percent(row.visitors.size, maxDailyVisitors)))}",
              "style={{ width: `${Math.max(stage.value ? 4 : 0, percent(stage.value, journeyMax))}%` }}": "style={analyticsWidthStyle(Math.max(stage.value ? 4 : 0, percent(stage.value, journeyMax)))}",
              "style={{ width: `${percent(item.sessions, maxSourceSessions)}%` }}": "style={analyticsWidthStyle(percent(item.sessions, maxSourceSessions))}",
              "style={{ width: `${percent(count, maxTransition)}%` }}": "style={analyticsWidthStyle(percent(count, maxTransition))}",
              "style={{ width: `${percent(count, maxDevice)}%` }}": "style={analyticsWidthStyle(percent(count, maxDevice))}",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'inline-style marker not found: {old}')
              text = text.replace(old, new, 1)
          page.write_text(text)

          css = Path('admin-app/app/analytics.css')
          css_text = css.read_text()
          css_marker = ".analytics-track i {\n  display: block;\n  height: 100%;"
          if css_marker not in css_text:
              raise SystemExit('analytics-track marker not found')
          css_text = css_text.replace(
              css_marker,
              ".analytics-track i {\n  display: block;\n  width: var(--analytics-width, 0%);\n  height: 100%;",
              1,
          )
          css.write_text(css_text)
          PY
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Repo lint
        run: npm run lint
      - name: Main typecheck
        run: npm run typecheck
      - name: Admin typecheck
        run: npm run admin:typecheck
      - name: Commit validated fixes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-admin-analytics-quality-temporary.yml
          git add admin-app/app/'(operations)'/analytics/page.tsx admin-app/app/analytics.css src/server/tenancy/ownerProductAnalyticsRepository.ts
          git commit -m 'fix(admin): satisfy analytics tenant and style gates'
          git push origin HEAD:feat/admin-product-analytics
