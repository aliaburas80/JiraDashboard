name: E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Was 20 — a run that hits real per-request slowness on a shared runner
    # got SIGKILLed mid-suite by this ceiling with no time left to even
    # upload the Playwright report, destroying the one diagnostic artifact
    # that would explain why. 30 gives genuine headroom to either finish or
    # fail cleanly with a report, now that playwright.config.ts's
    # MOBILE_ONLY_SPECS scoping also cut the suite from 20 full login+upload
    # cycles down to 8.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: delivery_clarity_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d delivery_clarity_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/delivery_clarity_e2e?sslmode=disable
      SESSION_SECRET: e2e-session-secret-value-at-least-32-chars
      CONFIG_ENCRYPTION_KEY: e2e-config-secret-value-at-least-32-chars
      STORAGE_DRIVER: temporary
      # CI/E2E-only: skips the persistent-storage requirement that a real
      # production boot enforces (see ERR-004 in product/ERRORS.md). Doubly
      # gated on `CI=true` (set automatically by GitHub Actions) in both
      # src/lib/env/server.ts and scripts/start-production.mjs, so it can
      # never trip on a real Render deploy.
      ALLOW_TEMPORARY_STORAGE_IN_CI: 'true'
      # CI/E2E-only: this job serves the app over plain http://127.0.0.1, not
      # HTTPS, so a Secure session cookie is silently dropped by WebKit (see
      # src/lib/session.ts's isEphemeralCiHttpRun for the full explanation and
      # why this is safe — same doubly-gated pattern as the flag above).
      E2E_ALLOW_INSECURE_COOKIES: 'true'
      MAX_UPLOAD_MB: 20
      LOG_LEVEL: info
      ADMIN_EMAIL: e2e-admin@deliveryclarity.app
      ADMIN_PASSWORD: E2E-admin-password-1
      ADMIN_NAME: E2E Admin

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed the E2E admin account
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Run critical-path E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
