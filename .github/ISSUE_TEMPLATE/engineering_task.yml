name: Engineering task
description: Track maintenance, refactoring, documentation, test, security, or performance work.
title: "chore: "
labels:
  - task
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - chore
        - docs
        - refactor
        - test
        - security
        - performance
        - ci
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repository, code-quality, documentation, or operational gap should be closed?
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected outcome
      description: What should be true after this task is complete?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Requirement one
        - [ ] Requirement two
        - [ ] Tests or validation added/updated when practical
        - [ ] Documentation updated when required
        - [ ] No regression introduced
    validations:
      required: true
  - type: textarea
    id: technical-considerations
    attributes:
      label: Technical considerations
      description: Include affected files, risks, dependencies, migrations, compatibility, or rollout notes.
    validations:
      required: true
